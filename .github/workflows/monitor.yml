name: Monitor (trigger alerts)

# Relay design: each run polls every 15 min for ~5h40m, then exits; the schedule
# keeps one run queued behind it (concurrency group), which takes over at once.
# GitHub throttles *scheduled starts* on free accounts to ~every 3h, but the poll
# cadence inside a run isn't throttled — so this gives true 15-min checks with no
# token or outside service. Public repo = unlimited free Actions minutes.
# This is what makes alerts fire with the laptop off. Signal-only: reads public
# market data via ccxt, writes trigger state to Supabase, sends Telegram alerts.

on:
  schedule:
    - cron: "7 * * * *"      # hourly (UTC) — backup restarter if the chain ever breaks
  workflow_dispatch:          # manual start (and how each run starts its successor)
    inputs:
      minutes:
        description: "How long this run polls before handing over (default 340)"
        required: false
        default: "340"

concurrency:
  group: monitor              # never overlap two monitor runs
  cancel-in-progress: false

permissions:
  contents: read
  actions: write              # lets a finishing run start its own successor

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355     # GitHub's hard cap per job is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Poll every 15 min (relay)
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
        run: python monitor.py --interval 900 --max-minutes ${{ github.event.inputs.minutes || '340' }} --quiet-start

      # Self-chaining: queue the next run before this one ends so there's no gap
      # (GitHub's scheduler only fires every ~6h on free repos). The dispatched run
      # waits in the concurrency group and starts the moment this one finishes.
      # Skipped if you cancel a run — that's how to stop the chain on purpose.
      - name: Hand over to the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main -R ${{ github.repository }}
