name: Morning Brief

# Daily market brief (BTC regime, macro score, overnight triggers, watchlist
# near-level flags, edge-decay flags) pushed to Telegram. Off the hot path;
# reads the shared Supabase state. Signal-only.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily — adjust to your local morning
  workflow_dispatch:        # run manually from the Actions tab

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Send brief
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:       ${{ secrets.FRED_API_KEY }}
        run: python morning_brief.py
