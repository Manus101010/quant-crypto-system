name: Track record admin

# Manual only. "export" saves every trigger row as a short-lived run artifact
# (deleted after 1 day) for analysis; "reset" starts a new tracking period now.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "export, reset or scan"
        required: true
        default: "export"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/track_admin.py ${{ github.event.inputs.action }}
      - name: Save export
        if: ${{ github.event.inputs.action == 'export' }}
        uses: actions/upload-artifact@v4
        with:
          name: track-export
          path: track_export.json
          retention-days: 1
