name: Track record admin

# "export" saves every trigger row as a run artifact; "reset" starts a new
# tracking period now; "scan" runs a full scan and arm.
# Nightly backup: the schedule below runs "export" every day and keeps it 7 days,
# so a wiped table can be restored from the last good night. The repo is PUBLIC:
# artifacts can be downloaded by anyone signed in to GitHub. The export holds the
# signal history only (no keys or secrets), so a 7 day retention is the trade-off.
on:
  schedule:
    - cron: "17 17 * * *"     # daily 17:17 UTC (about 3-4am Sydney)
  workflow_dispatch:
    inputs:
      action:
        description: "export, reset or scan"
        required: true
        default: "export"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/track_admin.py ${{ github.event.inputs.action || 'export' }}
      - name: Save export
        if: ${{ (github.event.inputs.action || 'export') == 'export' }}
        uses: actions/upload-artifact@v4
        with:
          name: track-export
          path: track_export.json
          retention-days: 7
